[package]
name = "bookrat"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A terminal UI that binds folders of MP3s into clean, chaptered M4B audiobooks"
authors = ["Roland Haller"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ProHaller/bookrat"
readme = "README.md"
keywords = ["audiobook", "m4b", "mp3", "tui", "ffmpeg"]
categories = ["command-line-utilities", "multimedia::audio"]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

[profile.release]
lto = "thin"
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
